<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debug Recommender</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 20px; }
        .section { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .info { background: #d1ecf1; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; }
        input { padding: 8px; margin: 5px; font-size: 14px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Recommender System Debugger</h1>
    
    <div class="section info">
        <h2>Step 1: Check Elements</h2>
        <div id="elements-check">Checking...</div>
    </div>
    
    <div class="section info">
        <h2>Step 2: Test Button Click</h2>
        <input id="month-input" placeholder="Enter month" value="December">
        <input id="duration-input" type="number" placeholder="Days" value="7">
        <button id="go">🔍 Find Destinations</button>
        <div id="status" style="margin: 10px 0; padding: 10px; background: #f0f0f0;">Status will appear here</div>
        <div id="results"></div>
    </div>
    
    <div class="section info">
        <h2>Step 3: Test API Direct</h2>
        <button onclick="testAPI()">Test API Directly</button>
        <pre id="api-result">Click button to test API</pre>
    </div>
    
    <div class="section info">
        <h2>Step 4: Console Logs</h2>
        <p>Open browser console (F12) and check for messages</p>
        <div id="console-messages" style="background: #000; color: #0f0; padding: 10px; font-family: monospace; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <script>
        // Capture console.log
        const originalLog = console.log;
        const messagesDiv = document.getElementById('console-messages');
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.join(' ');
            messagesDiv.innerHTML += message + '<br>';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };
        
        console.log('=== DEBUG PAGE LOADED ===');
        
        // Step 1: Check if elements exist
        window.addEventListener('load', function() {
            const elementsCheck = document.getElementById('elements-check');
            const checks = {
                'month-input': !!document.getElementById('month-input'),
                'duration-input': !!document.getElementById('duration-input'),
                'go button': !!document.getElementById('go'),
                'status div': !!document.getElementById('status'),
                'results div': !!document.getElementById('results')
            };
            
            let html = '<ul>';
            for (const [name, exists] of Object.entries(checks)) {
                const icon = exists ? '✅' : '❌';
                html += `<li>${icon} ${name}: ${exists ? 'FOUND' : 'NOT FOUND'}</li>`;
            }
            html += '</ul>';
            elementsCheck.innerHTML = html;
            
            console.log('Elements check:', checks);
        });
        
        // Step 2: Test API function
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.textContent = 'Loading...';
            console.log('Testing API...');
            
            try {
                const url = '/recommend?month=December&duration=7&topn=10';
                console.log('API URL:', url);
                
                const response = await fetch(url);
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('API Response:', data);
                
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('API Error:', error);
                resultDiv.textContent = 'ERROR: ' + error.message;
            }
        }
    </script>
    
    <!-- Load main.js to test it -->
    <script src="main.js"></script>
    
    <script>
        // Additional test after main.js loads
        setTimeout(function() {
            console.log('=== CHECKING AFTER MAIN.JS LOAD ===');
            console.log('main.js should have initialized by now');
            
            // Try to click button programmatically
            const btn = document.getElementById('go');
            if (btn) {
                console.log('Button found, can we get its listeners?');
                console.log('Button onclick:', btn.onclick);
                console.log('Button has click listener:', btn.onclick !== null);
            }
        }, 1000);
    </script>
</body>
</html>
